name: CASIROS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, Clippy, and Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "casiros-lint"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (strict, all features, all targets)
        run: cargo clippy --workspace --all-targets --all-features

      - name: Check compilation (all targets, all features)
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casiros
          POSTGRES_PASSWORD: casiros
          POSTGRES_DB: casiros
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "casiros-test"

      - name: Run all tests (unit, integration, and doc-tests)
        env:
          CASIROS_POSTGRES__URL: postgresql://casiros:casiros@localhost:5432/casiros
        run: cargo test --workspace --all-targets --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "casiros-docs"

      - name: Build docs
        run: cargo doc --workspace --no-deps --document-private-items

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "casiros-audit"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  deny:
    name: License and Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "casiros-coverage"

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage report
        env:
          CASIROS_POSTGRES__URL: postgresql://casiros:casiros@localhost:5432/casiros
        run: cargo tarpaulin --workspace --all-features --out Xml --timeout 120

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

      - name: Enforce coverage gate
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import sys
          root = ET.parse('cobertura.xml').getroot()
          covered = int(root.get('lines-covered'))
          valid = int(root.get('lines-valid'))
          rate = covered / valid
          print(f'Line coverage: {covered}/{valid} = {rate:.2%}')
          sys.exit(0 if rate >= 0.60 else 1)
          "
