name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Export OpenAPI spec
        run: |
          cargo run -p casiros-api --bin casiros-api-export-openapi > docs/openapi.json

      - name: Build docs
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material mkdocs-openapi-plugin

      # The strict build is the part worth gating merges on: it fails on broken
      # links and bad references whether or not the site is ever published.
      - name: Build site
        run: mkdocs build --strict

      # Everything below publishes to GitHub Pages, which is switched off for
      # this repository. configure-pages fails outright when Pages is disabled,
      # so these steps are gated on an opt-in variable rather than running and
      # failing on every docs change. To turn the site on: enable Pages (repo
      # Settings -> Pages, source "GitHub Actions"), then add a repository
      # variable PUBLISH_DOCS=true. Note Pages on a private repository needs a
      # paid plan, and publishing makes the site reachable by its URL.
      - name: Setup Pages
        if: vars.PUBLISH_DOCS == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
