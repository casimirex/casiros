[workspace]
members = [
    "crates/core",
    "crates/dag",
    "crates/simulator",
    "crates/api",
    "crates/api-client",
    "crates/bench",
    "crates/cli",
    "crates/macros",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["CASIROS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/casiros/casiros"
rust-version = "1.85"

[workspace.dependencies]
# Domain
casiros-core = { path = "crates/core" }
casiros-dag = { path = "crates/dag" }
casiros-simulator = { path = "crates/simulator" }
casiros-api = { path = "crates/api" }
casiros-macros = { path = "crates/macros" }

# Math & finance
rust_decimal = { version = "1.36", features = ["maths"] }
rust_decimal_macros = "1.36"

# Error handling
thiserror = "2.0"

# Async runtime (future phases)
tokio = { version = "1.43", features = ["full"] }

# Web framework (future phases)
actix-web = "4.9"
actix-web-httpauth = "0.8"

# Graphs (future phases)
petgraph = "0.7"

# Parallelism (future phases)
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenAPI
utoipa = { version = "5", features = ["decimal"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
assert_cmd = "2"
criterion = "0.5"
predicates = "3"
proptest = "1.6"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
