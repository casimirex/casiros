[workspace]
members = [
    "crates/core",
    "crates/dag",
    "crates/simulator",
    "crates/api",
    "crates/api-client",
    "crates/bench",
    "crates/cli",
    "crates/macros",
    "crates/worker",
    "crates/e2e",
]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
authors = ["CASIROS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/casiros/casiros"
rust-version = "1.88"
readme = "README.md"
keywords = ["finance", "simulation", "dag", "monte-carlo", "rust"]
categories = ["finance", "mathematics", "science"]
documentation = "https://docs.rs/casiros-core"

[workspace.dependencies]
# Domain
casiros-core = { path = "crates/core", version = "0.9.0" }
casiros-dag = { path = "crates/dag", version = "0.9.0" }
casiros-simulator = { path = "crates/simulator", version = "0.9.0" }
casiros-api = { path = "crates/api", version = "0.9.0" }
casiros-macros = { path = "crates/macros", version = "0.9.0" }

# Math & finance
rust_decimal = { version = "1.36", features = ["maths"] }
rust_decimal_macros = "1.36"

# Error handling
thiserror = "2.0"

# Async trait helpers
async-trait = "0.1"

# Async runtime (future phases)
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Web framework (future phases)
actix-web = "4.9"
actix-web-httpauth = "0.8"
actix-ws = "0.3"
actix-cors = "0.7"
actix-files = "0.6"

# Graphs (future phases)
petgraph = "0.7"

# Parallelism (future phases)
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenAPI
utoipa = { version = "5", features = ["decimal"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "blocking"] }

# WebSocket client
tokio-tungstenite = "0.26"
futures-util = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# I/O
csv = "1.3"
calamine = "0.36"
rust_xlsxwriter = "0.84"

# Configuration
config = "0.14"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "json",
    "uuid",
    "time",
] }

# Metrics
prometheus = { version = "0.14", features = ["process"] }

# Cache
redis = { version = "0.27", features = ["tokio-comp", "json", "connection-manager"] }

# OpenTelemetry
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.28"

# Identifiers and timestamps
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }

# Testing
assert_cmd = "2"
criterion = "0.5"
predicates = "3"
proptest = "1.6"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
