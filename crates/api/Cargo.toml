[package]
name = "casiros-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CASIROS infrastructure layer — HTTP API server"

[[bin]]
name = "casiros-api"
path = "src/main.rs"

[[bin]]
name = "casiros-api-export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
async-trait = { workspace = true }
casiros-core = { workspace = true }
casiros-dag = { workspace = true }
casiros-simulator = { workspace = true }
actix-web = { workspace = true }
actix-web-httpauth = { workspace = true }
actix-ws = { workspace = true }
actix-cors = { workspace = true }
actix-files = { workspace = true }
tokio-stream = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
config = { workspace = true }
prometheus = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
